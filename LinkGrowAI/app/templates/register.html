{% extends "base.html" %}
{% block content %}
<div class="auth-panel">
  <h2>Create Account</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Name</label>
    <input class="form-control" name="name" required>
    <label class="form-label mt-3">Email</label>
    <input class="form-control" name="email" type="email" required>
    <label class="form-label mt-3">Password</label>
    <input class="form-control" name="password" type="password" minlength="8" required>
    <label class="form-label mt-3">LinkedIn Profile URL</label>
    <input class="form-control" name="linkedin_profile_url" type="url" placeholder="https://www.linkedin.com/in/your-name">
    <div class="form-text">Used to connect recommendations to your profile. Private metrics need authorized LinkedIn API access or manual import.</div>
    <button class="btn btn-success w-100 mt-4" type="submit">Register</button>
  </form>
</div>
{% endblock %}
